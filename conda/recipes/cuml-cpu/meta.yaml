# Usage:
#   conda build . -c conda-forge -c numba -c rapidsai -c pytorch
{% set py_version=environ.get('CONDA_PY', 36) %}

package:
  name: cuml-cpu
  version: 23.02.00

source:
  git_url: ../../..

build:
  number: 150
  string: py{{ py_version }}_{{ GIT_DESCRIBE_HASH }}_{{ GIT_DESCRIBE_NUMBER }}
  script_env:
    - VERSION_SUFFIX

requirements:
  build:
    - cmake {{ cmake_version }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - sysroot_{{ target_platform }} {{ sysroot_version }}
    - ninja
  host:
    - python x.x
    - setuptools
    - scikit-build>=0.13.1
    - cython>=0.29,<0.30
  run:
    - python x.x
    - numpy
    - scikit-learn=1.2
    - hdbscan=0.8.29
    - umap-learn=0.5.3
    - nvtx
    - pandas

tests:                                 # [linux64]
  imports:                             # [linux64]
    - cuml-cpu                         # [linux64]

about:
  home: http://rapids.ai/
  license: Apache-2.0
  # license_file: LICENSE
  summary: cuML-CPU library
